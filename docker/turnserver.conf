# Coturn TURN Server configuration for Chatables WebRTC relaying
listening-port=3478
alt-listening-port=3479

# Long-term credential mechanism (required for WebRTC)
lt-cred-mech
realm=chatables.local

# Default credential for local development/testing
user=chatablesuser:chatablessecret

# Enable fingerprinting (required for WebRTC)
fingerprint

# Keep-alive intervals and timeouts
stale-nonce=600

# Security and networking policies
no-multicast-peers
no-stdout-log
verbose
